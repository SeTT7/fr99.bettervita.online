        /* =========================================================
           NEW PRODUCT SECTION STYLES - IRONBRAIN

        :root{
            --primary:#151c3a; --primary-2:#0a2038;
            --secondary:#1f6ad1; --secondary-2:#04234d;
            --tertiary:#5b7aa0;
            --accent:#29c6ff; --accent-2:#00e0cf;

            --tint:#e9f4ff; --tint-2:#d7e9ff;

        /* CARD */
        .product-card {
            font-family: Montserrat, system-ui, Segoe UI, Roboto, Arial;
            background: var(--card);
            border: 2px solid #d8e4ef;
            border-radius: 18px;
            box-shadow: 0 4px 30px rgba(10,30,60,.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            width: clamp(300px, 31vw, 380px);
            transition:
                transform .35s cubic-bezier(.22,.61,.36,1),
                box-shadow .35s cubic-bezier(.22,.61,.36,1),
                border-color .25s ease;
            will-change: transform, box-shadow;
            transform: translateZ(0);
        }

        .product-card, .product-card * {
            min-width: 0;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 44px rgba(10,30,60,.18);
            border-color: var(--accent);
        }

        .product-card .band {
            background: var(--tint);
            border-bottom: 2px solid var(--tint-2);
            padding: 12px 16px;
            text-transform: capitalize;
            font-weight: 900;
            color: var(--tertiary);
            text-align: center;
            font-size: clamp(18px, 1.2vw + 14px, 18px);
            line-height: 1.12;
            letter-spacing: .2px;
        }

        /* Promo (destaque) */
        .product-card.promo {
            background: linear-gradient(180deg, #1d2a6a 0%, #0d1438 100%);
            color: #fff;
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 3px rgba(43,188,255,.35), 0 18px 60px rgba(12,35,90,.5);
        }

        .product-card.promo:hover {
            transform: translateY(-8px) scale(1.015);
            box-shadow: 0 0 0 4px rgba(43,188,255,.45), 0 24px 72px rgba(12,35,90,.6);
        }

        .product-card.promo .band {
            background: transparent;
            border-bottom: 0;
            color: #9fd0ff;
            font-weight: 900;
            font-size: clamp(16px, 1.4vw + 16px, 24px);
        }

        /* Imagem */
        .product-card .img-wrap {
            padding: 14px 16px 0;
            text-align: center;
            min-height: 220px;
            position: relative;
        }

        .product-card .img-wrap img {
            width: 100%;
            height: auto;
            max-width: 340px;
            display: inline-block;
            transition: transform .35s cubic-bezier(.22,.61,.36,1);
        }

        .product-card:hover .img-wrap img {
            transform: scale(1.03);
        }

        .product-card.promo .img-wrap img {
            max-width: 460px;
        }

        /* Título de quantidade */
        .product-card .supply {
            position: static;
            display: inline-block;
            margin: 0 auto 30px;
            background: transparent;
            border: 0;
            box-shadow: none;
            color: var(--secondary-2);
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1.05;
        }

        .product-card .supply b {
            display: block;
            font-size: 32px;
        }

        .product-card .supply .supply-sub {
            display: block;
            font-size: 15px;
            margin-top: 4px;
            letter-spacing: .3px;
        }

        .product-card.promo .supply {
            color: #e9f4ff;
        }

        /* Preço */
        .product-card .price {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            font-weight: 900;

        }

        .product-card .price b {

        }

        /* Linha + benefícios */
        .product-card .rule {
            height: 2px;

            margin: 6px 16px;

        .product-card .img-wrap,
        .product-card .price,
        .product-card .pill-list,
        .product-card .btn-area,
        .product-card .subinfo {
            padding-left: 15px;
            padding-right: 15px;
        }

        .product-card .rule {
            margin-left: 15px;
            margin-right: 15px;
        }

        .product-card .pill-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .product-card .pill-i {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f3f8ff;
            border: 1px solid #d8e7f7;
            border-radius: 10px;
            padding: 10px 12px;
            font-weight: 900;
            color: #0f2b44;
            white-space: normal;
            overflow-wrap: anywhere;
            transition: background .25s ease, border-color .25s ease, transform .25s ease;
        }

        .product-card:hover .pill-i {
            background: #eaf4ff;
            border-color: var(--accent);
        }

        /* Botão */
        .product-card .btn-area {
            padding-top: 14px;
            padding-bottom: 8px;
        }

        .product-card .btn {
            width: 100%;
            display: block;
            text-align: center;
            padding: 14px 16px;
            border-radius: 12px;
            font-weight: 900;
            letter-spacing: .4px;
            background: #e7eaee;
            color: #2b3440;
            border: 1px solid #d1d9e0;
            transition: transform .25s ease, background .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease;
            will-change: transform;
            text-decoration: none;
            font-family: Montserrat, system-ui, Segoe UI, Roboto, Arial;
        }

        .product-card .btn .cart {
            margin-right: 6px;
        }

        .product-card .btn:hover {
            background: #29c6ff;

            transform: scale(1.035);
            box-shadow: 0 10px 24px rgba(41,198,255,.25);

        .product-card.promo .btn {
            background: linear-gradient(180deg, var(--success), var(--success-2));
            color: #fff;
            border: 0;
        }

        .product-card.promo .btn:hover {
            background: linear-gradient(180deg, var(--success-2), var(--success));
            transform: scale(1.045);
        }

        /* Bandeiras + totais */
        .product-card .flags {
            width: 200px;

            margin: 14px auto 0;

        .product-card .subinfo {

        .product-card .subinfo .total {

        }

        .product-card.promo .subinfo b {
            color: #fff;
        }

        /* =========================================================
           MOBILE: layout interno do card + ORDEM 6 → 3 → 2
           ========================================================= */
        @media (max-width: 600px) {

            .product-card {

            .product-card.promo .img-wrap img {

            .product-card .supply {
                position: absolute;

        /* Comments Section */
